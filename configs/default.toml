# TrailGen default parameters.
# Distances in meters, angles in degrees. Override any value with --config my.toml.

[grid]
dem_resolution = 1.0        # ground model; 0.5 for QL1 tiles, 1.0 for QL2
chm_resolution = 0.5        # canopy height model
cost_resolution = 0.25      # traversability / Nav2 map

[ground]
classification = 2          # ASPRS ground class
min_ground_fraction = 0.01  # below this, fall back to lowest-point ground filter
max_ground_residual = 0.5   # 'ground' points this far above local ground are dropped

[trees]
min_tree_height = 3.0       # treetops lower than this are ignored
min_crown_height = 2.0      # canopy cells lower than this are not crown
# Search radius for treetops grows with tree height: r = base + slope * height.
window_base = 0.6
window_slope = 0.08
max_crown_radius = 10.0
# Two peaks are separate trees only if the canopy between them dips by at least
# max(min_saddle_drop, min_saddle_fraction * height of the lower peak).
min_saddle_drop = 1.5
min_saddle_fraction = 0.15
# Trunk diameter from height: dbh_cm = a * height_m ** b.
# PLACEHOLDER coefficients - calibrate per forest type (e.g. against NEON plots).
dbh_a = 1.5
dbh_b = 1.05

[vegetation]
low_min = 0.3               # shrub / low-obstacle band, height above ground
low_max = 2.0
smoothing = 1.0             # neighbourhood radius for density, meters

[robot]
# Unitree Go2 defaults. Replace with values measured on your own robot.
half_width = 0.16           # Go2 body is about 0.31 m wide
safety_margin = 0.10        # extra clearance around hard obstacles
max_slope = 30.0            # slopes steeper than this are blocked
max_roughness = 0.15        # DEM roughness (m) treated as fully costly

[cost_weights]
slope = 0.5
roughness = 0.2
shrub = 0.6
