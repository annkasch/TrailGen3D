[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "trailgen3d"
version = "0.1.0"
description = "Sky2Trail (aerial lidar to ground-level data) and TrailGen3D (navigation worlds)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "tomli>=2; python_version < '3.11'",
]

[project.optional-dependencies]
# Reading real 3DEP tiles (LAS/LAZ) and writing GeoTIFFs.
geo = [
    "laspy[lazrs]>=2.4",
    "pyproj>=3.5",
    "rasterio>=1.3",
]
dev = ["pytest>=7"]

[project.scripts]
sky2trail = "sky2trail.cli:main"
trailgen = "trailgen3d.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
