[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "trailgen3d"
version = "0.1.0"
description = "Navigation-ready 3D simulation worlds of natural terrain from public aerial lidar"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
# Reading real 3DEP tiles (LAS/LAZ) and writing GeoTIFFs.
geo = [
    "laspy[lazrs]>=2.4",
    "pyproj>=3.5",
    "rasterio>=1.3",
]
dev = ["pytest>=7"]

[project.scripts]
trailgen = "trailgen3d.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
